<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>そらナビ</title>
  <meta name="description" content="天気・警報・地震情報をまとめて確認できるアプリ">
  <meta name="theme-color" content="#0b63c5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1621" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="そらナビ">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=1.3.0">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="place">
        <h1 id="placeName">熊谷市</h1>
        <div id="updatedAt" class="muted small">読み込み中…</div>
      </div>
      <button id="btnSearch" class="icon-btn" aria-label="地点を検索">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16a6.47 6.47 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
      <button id="btnRefresh" class="icon-btn" aria-label="更新">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
      <button id="btnSettings" class="icon-btn" aria-label="設定">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7.07 7.07 0 0 0-.05-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54A.48.48 0 0 0 13.93 2h-3.84a.48.48 0 0 0-.48.41l-.36 2.54a7.36 7.36 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.73 8.47a.48.48 0 0 0 .12.61l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.05.24.25.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54a7.36 7.36 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
    </div>
    <nav class="chips" id="chips" aria-label="地点"></nav>
  </header>

  <div id="offline" class="notice offline" hidden></div>
  <div id="quakeAlert" class="quake-alert" hidden></div>
  <button id="warnBanner" class="warn-banner" hidden></button>

  <section id="hero" class="hero card" aria-live="polite"></section>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="days" aria-selected="true">今日・明日</button>
    <button role="tab" data-tab="hourly" aria-selected="false">1時間</button>
    <button role="tab" data-tab="weekly" aria-selected="false">2週間</button>
    <button role="tab" data-tab="radar" aria-selected="false">雨雲</button>
    <button role="tab" data-tab="quake" aria-selected="false">地震</button>
  </div>

  <main>
    <section id="tab-days" class="tab-panel"></section>
    <section id="tab-hourly" class="tab-panel" hidden></section>
    <section id="tab-weekly" class="tab-panel" hidden></section>
    <section id="tab-radar" class="tab-panel" hidden></section>
    <section id="tab-quake" class="tab-panel" hidden></section>
  </main>

  <footer class="footer muted small">
    <p>気象データ：Open-Meteo（各国気象機関のモデル）／警報・地震・雨雲レーダー：気象庁／地図・地名検索：国土地理院</p>
    <p>本アプリは参考情報です。防災上の判断は必ず<a href="https://www.jma.go.jp/bosai/" target="_blank" rel="noopener">気象庁</a>や自治体の発表を確認してください。</p>
    <p>バージョン <span id="appVersion">―</span></p>
  </footer>

  <dialog id="searchDialog" class="sheet">
    <form method="dialog" class="sheet-head">
      <h2>地点を検索</h2>
      <button class="text-btn" value="cancel">閉じる</button>
    </form>
    <form id="searchForm" class="search-row" autocomplete="off">
      <input id="searchInput" type="search" placeholder="市区町村名・地名（例：札幌市）" enterkeyhint="search">
      <button class="primary-btn" type="submit">検索</button>
    </form>
    <ul id="searchResults" class="list"></ul>
  </dialog>

  <dialog id="settingsDialog" class="sheet">
    <form method="dialog" class="sheet-head">
      <h2>設定</h2>
      <button class="text-btn" value="cancel">閉じる</button>
    </form>
    <form id="settingsForm" class="settings">
      <h3>傘が必要と判断する基準</h3>
      <label>降水確率
        <span class="inline"><input id="setPop" type="number" min="0" max="100" step="10" inputmode="numeric"> %以上</span>
      </label>
      <label>または 1時間降水量
        <span class="inline"><input id="setMm" type="number" min="0" max="10" step="0.1" inputmode="decimal"> mm以上</span>
      </label>
      <button class="primary-btn" type="submit">保存</button>
      <h3>最近の地点</h3>
      <button id="btnClearRecent" class="text-btn danger" type="button">履歴を消去</button>
    </form>
  </dialog>

  <dialog id="warnDialog" class="sheet">
    <form method="dialog" class="sheet-head">
      <h2>警報・注意報</h2>
      <button class="text-btn" value="cancel">閉じる</button>
    </form>
    <div id="warnDetail"></div>
  </dialog>

  <script>
    // ファイルを直接開くと（file://）ブラウザの制限でアプリが動かないため案内を出す
    if (location.protocol === 'file:') {
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="background:#fff4bf;color:#5a4600;padding:12px 14px;border-radius:12px;margin:12px 0;font-size:14px">' +
        '⚠ このページはファイルを直接開いているため動作しません。GitHub Pages などで公開したURL、' +
        'またはローカルサーバー（http://localhost）経由で開いてください。詳しくは README.md を参照。</div>');
    }
  </script>
  <script type="module" src="app.js?v=1.3.0"></script>
  <script>
    // 古い app.js がキャッシュから読み込まれた場合などに、真っ白のままにせず案内を出す
    setTimeout(function () {
      if (location.protocol === 'file:' || window.__appVersion === '1.3.0') return;
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="background:#fff4bf;color:#5a4600;padding:12px 14px;border-radius:12px;margin:12px 0;font-size:14px">' +
        '⚠ アプリの一部が古いまま、または読み込めていません（表示中: ' + (window.__appVersion || '不明') + ' / 必要: 1.3.0）。' +
        '全ファイルがアップロードされているか確認し、数分おいてページを再読み込みしてください。</div>');
    }, 6000);
  </script>
</body>
</html>
